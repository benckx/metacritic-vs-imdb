name: Full refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install pillow playwright
          python -m playwright install --with-deps chromium
      - name: Refresh data and visualizations
        run: ./full_refresh.sh
      - name: Commit and push generated files
        run: |
          git add -A -- critics_over_users.csv users_over_critics.csv js/data.js posters/ exports/
          if git diff --cached --quiet; then
            echo "No generated files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh movie data and visualizations"
          git push origin "HEAD:$GITHUB_REF"
